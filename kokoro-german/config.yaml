name: "Wyoming Kokoro TTS (German Martin)"
slug: "kokoro_german_tts"
version: "1.2.0"
description: "High-quality local German Kokoro TTS (voice Martin) with Wyoming protocol support for Home Assistant Voice Assist"
url: "https://github.com/Godelaune/Kokoro-82M-ONNX-German-Martin"
arch:
  - amd64
init: false
host_network: true
ports:
