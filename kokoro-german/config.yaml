ports_description:
  10203/tcp: "Wyoming Protocol"
  8881/tcp: "FastAPI OpenAI TTS endpoint"
discovery:
  - wyoming
options:
  kokoro_workers: 2
  speed: 1.125
schema:
  kokoro_workers: int
  speed: float
